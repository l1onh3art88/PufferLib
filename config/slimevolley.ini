[base]
env_name = slimevolley
# Same class of 5.0 trainer change that blocked drone: stale actor + RNN carry.
async = 1
reset_every_horizon = 1
checkpoint_interval = 100

[vec]
total_agents = 16384
num_buffers = 4
num_threads = 2
num_policies = 1
hist_policy_percent = 0.15
hist_policy_hidden_size = 128
hist_policy_num_layers = 3

# Selfplay: slot 0 is the primary policy, slot 1 is a frozen checkpoint on
# hist_policy_percent of the envs. Final score is the primary's mean win rate
# over up to eval_pool_size pool opponents.
[selfplay]
enabled = 0
max_size = 100
seed = 42
opp_timeout_steps = 100_000_000
eval_pool_size = 8
eval_games = 4096
# Set > 0 to score off the bot ladder instead of the pool eval.
eval_bot_games = 0
eval_bots = 0

# 1v1: num_agents + num_bots must be 2. Selfplay instead of the bot with
# ./puffer train --env.num_agents=2 --env.num_bots=0 --selfplay.enabled=1
#     --vec.num_policies=2
[env]
num_agents = 1
num_bots = 1
bot_policy = 0
max_ticks = 3000

[policy]
hidden_size = 128
# Constellation #206 was 3.297; 5.0 truncates to int.
num_layers = 3

[train]
gpus = 1
# 4.0 #206 solved at 115M; 5.0 needs ~250M without prio replay.
total_timesteps = 280000000
learning_rate = 0.00207143
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.993389
gae_lambda = 0.984654
replay_ratio = 2.85524
clip_coef = 0.142887
vf_coef = 5
vf_clip_coef = 0.0465092
max_grad_norm = 0.1
ent_coef = 0.00113432
momentum = 0.981078
minibatch_size = 4096
horizon = 32
# 4.0 always applied rho/c clips. vtrace=0 made those keys no-ops.
vtrace = 1
vtrace_rho_clip = 1.3635
vtrace_c_clip = 2.29725

[sweep]
# Lives margin in [0, 1]; the default cl_perf is a robocode curriculum metric
# this env does not log. Symmetric selfplay pins perf at 0.5, so a selfplay
# sweep scores off the pool eval below; vs the bot perf is the dense signal.
metric = perf
downsample = 5

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e8
max = 2e9
mean = 3e8
scale = time
