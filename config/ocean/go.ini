[base]
package = ocean
env_name = puffer_go
policy_name = Go
rnn_name = Recurrent

[env]
num_envs = 4096
reward_move_pass = -0.6
reward_move_valid = 0
reward_move_invalid = -0.5
reward_opponent_capture = -0.4
reward_player_capture = 0.25

[train]
total_timesteps = 500_000_000
checkpoint_interval = 50
num_envs = 2
num_workers = 2
env_batch_size =1
batch_size = 524288
update_epochs = 1
minibatch_size = 131072
bptt_horizon = 8
learning_rate = 0.014216457166888572
ent_coef = 0.003519165145677917
gae_lambda = 0.8379584157201555
gamma = 0.98555990582696
max_grad_norm = 0.30760273337364197
vf_coef = 0.2519058004414533
anneal_lr = False
device = cuda

[sweep.parameters.env.parameters.reward_move_invalid]
distribution = uniform
min = -1.0
max = 0.0

[sweep.parameters.env.parameters.reward_move_pass]
distribution = uniform
min = -1.0
max = 0.0

[sweep.parameters.env.parameters.reward_player_capture]
distribution = uniform
min = 0.0
max = 1.0

[sweep.parameters.env.parameters.reward_opponent_capture]
distribution = uniform
min = -1.0
max = 0.0


