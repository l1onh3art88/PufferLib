[base]
env_name = chess

[selfplay]
enabled = 1
max_size = 64
swap_winrate = 0.9
min_games = 4096

[vec]
total_agents = 8192
num_buffers = 1
num_threads = 2
num_frozen_banks = 1
frozen_bank_pct = 0.1

[env]
max_moves = 5000
reward_draw = 0
reward_invalid_piece = 0
reward_invalid_move = 0
reward_repetition = 0
enable_50_move_rule = 1
enable_threefold_repetition = 1
mode = 1
random_fen = 0
render_fps = 30
fen_curric_pct = 0.9

[policy]
hidden_size = 512
num_layers = 3.03675
expansion_factor = 1

[train]
gpus = 1
seed = 42
total_timesteps = 10_000_000_000
learning_rate = 0.00272786
anneal_lr = 1
min_lr_ratio = 0.086914
gamma = 0.994795
gae_lambda = 0.754641
replay_ratio = 0.25
clip_coef = 0.557019
vf_coef = 4.37465
vf_clip_coef = 1.69524
max_grad_norm = 3.54293
ent_coef = 0.0917971
beta1 = 0.972205
beta2 = 0.9
eps = 8.51435e-11
minibatch_size = 32768
horizon = 64
vtrace_rho_clip = 1.99404
vtrace_c_clip = 2.19484
prio_alpha = 1
prio_beta0 = 0.474524
torch_deterministic = 1
adam_beta1 = 0.963206
adam_beta2 = 0.99999
adam_eps = 5.09326e-08
update_epochs = 1
[sweep]
# Score each trial by winrate in a 2-policy match against a fixed enemy rather
# than the training-time self-play env/score. 'latest' resolves to the newest
# .bin in checkpoint_dir/chess/**. Enemy arch must match the checkpoint's arch.
match_enemy_model_path = 'checkpoints/chess/qehargbp/0000019818610688.bin'
match_num_games = 4096
match_enemy_hidden_size = 256
match_enemy_num_layers = 3

[sweep.train.total_timesteps]
distribution = log_normal
min = 5e8
max = 3e9
mean = 2e9
scale = time

[sweep.selfplay.swap_winrate]
distribution = uniform
min = 0.55
max = 0.90
scale = auto
