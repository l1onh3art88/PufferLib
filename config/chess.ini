[base]
env_name = chess

[vec]
total_agents = 16384
num_buffers = 2.06812
num_threads = 16

[env]
max_moves = 5000
reward_draw = 0
reward_invalid_piece = 0
reward_invalid_move = 0
reward_repetition = 0
enable_50_move_rule = 1
enable_threefold_repetition = 1
# 0 = random opponent, 1 = selfplay, 2 = human, 3 = human vs random
mode = 1
random_fen = 0
render_fps = 30
fen_curric_pct = 0.9

[policy]
hidden_size = 256
num_layers = 3.33771
expansion_factor = 1

[train]
gpus = 1
seed = 42
total_timesteps = 10_000_000_000
learning_rate = 0.0005
anneal_lr = 1
min_lr_ratio = 0.086914
gamma = 0.961455
gae_lambda = 0.949049
replay_ratio = 0.509043
clip_coef = 0.308217
vf_coef = 3.08734
vf_clip_coef = 3.32022
max_grad_norm = 4.18488
ent_coef = 0.0139192
beta1 = 0.746743
beta2 = 0.9
eps = 3.55696e-13
minibatch_size = 4096
horizon = 32
vtrace_rho_clip = 2.51962
vtrace_c_clip = 1.94897
prio_alpha = 0.53692
prio_beta0 = 0.372948
torch_deterministic = 1
adam_beta1 = 0.963206
adam_beta2 = 0.99999
adam_eps = 5.09326e-08
update_epochs = 1
bptt_horizon = 256

[sweep]
# Score each trial by winrate in a 2-policy match against a fixed enemy rather
# than the training-time self-play env/score. 'latest' resolves to the newest
# .bin in checkpoint_dir/chess/**. Enemy arch must match the checkpoint's arch.
match_enemy_model_path = 'checkpoints/chess/qehargbp/0000099999547392.bin'
match_num_games = 4096
match_enemy_hidden_size = 256
match_enemy_num_layers = 3

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e8
max = 1e9
mean = 3e8
scale = time
