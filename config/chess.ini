[base]
env_name = chess

[selfplay]
enabled = 1
max_size = 500
opp_timeout_steps = 200_000_000
# Final Protein point = mean env/perf over the bot ladder (1.0 win / 0.5 draw /
# 0.0 loss). Rungs are ocean/chess/chess.h's BOT_* ids: random, then Maia 1100 /
# 1500 / 1900. Measured head-to-head, that ordering is monotone (1900 scores
# .605 on 1500, 1500 scores .633 on 1100), so it is a real difficulty ladder.
# Per rung, so this is 4 x 640 games. 640 / eval_bot_envs = 10 games per env.
eval_bot_games = 640
eval_bots = 1,2,3
# One lc0 child per env, so tens of envs rather than the default 8192. Maia is
# sequential within a process (one blocking UCI round-trip at a time), so eval
# throughput comes from running many engines at once. Two rules, both measured
# on a 32-core box:
#   - eval_bot_threads = core count. Going past it costs throughput
#     (64 threads measured slower than 32 at the same env count).
#   - eval_bot_envs >= 2x threads. At 1:1 every env reaches the learner's turn
#     together and all engines idle in lockstep; extra envs desynchronise the
#     games and keep the engines fed. Measured 64/32 = 10.1 games/s vs
#     32/32 = 8.4, and 32/16 = 8.8 vs 32/32 = 8.4.
# Costs ~115MB RSS per child (~7.4GB here) and ~3.5 min of ladder per trial.
# max_moves is deliberately not overridden below: the 50-move rule and
# threefold repetition end games first, so 400 vs 5000 measured identical.
eval_bot_envs = 64
eval_bot_threads = 32

# Ladder eval only: 1 learner vs 1 scripted opponent (mode 4), from the standard
# opening rather than the training FEN curriculum, so rungs are comparable.
[bot_eval]
mode = 4
random_fen = 0
fen_curric_pct = 0

[vec]
total_agents = 8192
num_buffers = 1
num_threads = 2
num_policies = 2
hist_policy_percent = 0.1
hist_policy_hidden_size = 256 
hist_policy_num_layers = 3

[env]
max_moves = 5000
reward_draw = 0
reward_invalid_piece = 0
reward_invalid_move = 0
reward_repetition = 0
enable_50_move_rule = 1
enable_threefold_repetition = 1
mode = 1
random_fen = 0
# Opponent for mode 4. Ignored while training in selfplay (mode 1); the ladder
# sweeps it across [selfplay] eval_bots.
bot_policy = 0
render_fps = 30
fen_curric_pct = 0.9

[policy]
hidden_size = 256 
num_layers = 3

[train]
total_timesteps = 2_000_000_000
learning_rate = 0.000572786
min_lr_ratio = 0.086914
gamma = 0.9994795
gae_lambda = 0.754641
replay_ratio = 0.25
clip_coef = 0.557019
vf_coef = 4
vf_clip_coef = 1.69524
max_grad_norm = 1.5 
ent_coef = 0.000984801
anneal_ent_coef = 1
momentum = 0.972205
minibatch_size = 32768
horizon = 64

[sweep]
metric = selfplay/bot_ladder_perf

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e9
max = 10e9
mean = 5e9
scale = time

[sweep.vec.num_buffers]
distribution = uniform_pow2
min = 1
max = 8
scale = auto

[sweep.vec.hist_policy_percent]
distribution = uniform
min = 0.05
max = 0.5
scale = auto

# How often historical selfplay opponents are resampled from the pool. Trials
# run 1e9-10e9 steps, so the range spans ~100 resamples per trial at the low end
# to effectively never at the high end; mean sits on the current 2e8 default.
[sweep.selfplay.opp_timeout_steps]
distribution = log_normal
min = 1e7
max = 5e9
mean = 2e8
scale = auto

# Fraction of episodes that start from resources/chess/fens.txt instead of the
# standard opening. 0 = always the start position (the file is not even loaded),
# 1 = always a curriculum FEN. Untested territory: the file was missing until
# now, so every trial so far effectively ran at 0 regardless of this setting.
[sweep.env.fen_curric_pct]
distribution = uniform
min = 0
max = 1
mean = 0.5
scale = auto
