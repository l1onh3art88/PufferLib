[base]
env_name = robocode
checkpoint_interval = 100


[vec]
total_agents = 16384
num_buffers = 4
num_threads = 4
num_frozen_banks = 1
frozen_bank_pct = 0.1
frozen_bank_hidden_size = 256
frozen_bank_num_layers = 4

[selfplay]
enabled = 0
max_size = 100
elo_init = 0
elo_k = 16
seed = 42
snapshot_interval = 200000000
opp_timeout_steps = 100000000
pfsp_power = 1
pfsp_epsilon = 0.05
pfsp_explore = 1

[smerl]
num_modes = 2
enabled = 0
bonus_coef = 0
activation_score = 0
gate_enter_epsilon = 0.03
gate_exit_epsilon = 0.06
eval_interval_steps = 200000000
eval_games = 2048
score_ema = 0.8
disc_hidden = 64
disc_lr = 0
embed_lr = 0.000791803
force_mode = -1
heldout_bots = '3,4,5,6'

[env]
num_agents = 1
num_bots = 1
width = 800
height = 600
reward_damage = 0.000374623
reward_spot = 0
reward_melee_damage_inflicted = 0.00542576
reward_damage_taken = -0.00303139
reward_range_damage_inflicted = 0.0132791
dr = 0.6
bot_policy = 6
max_ticks = 3000
# Curriculum vs scripted bot: each bot tick, with probability bot_cl_noise,
# replace the bot policy with random discrete actions (agent action tables).
# On each agent win, bot_cl_noise -= bot_cl_decay (clamped at 0 = full bot).
# Example: start 50% random, drop 1% per win → 50 wins to full strength.
bot_cl_noise = 0.50
bot_cl_decay = 0.01

[policy]
hidden_size = 128 
num_layers = 3 
expansion_factor = 1

[train]
gpus = 1
seed = 42
total_timesteps = 503_380_126
learning_rate = 0.00440825
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.998469
gae_lambda = 0.867037
replay_ratio = 0.947565
clip_coef = 0.371705
vf_coef = 3.16263
vf_clip_coef = 1.17854
max_grad_norm = 1.85731
ent_coef = 0.000951874
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
beta1 = 0.965675
beta2 = 0.999009
eps = 7.07942e-13
minibatch_size = 8192
horizon = 128
vtrace_rho_clip = 2.19052
vtrace_c_clip = 1.5952
prio_alpha = 1
prio_beta0 = 1
global_total_timesteps = 3032240128
local_total_timesteps = 3032240128

[sweep]
league = True

[sweep.train.total_timesteps]
distribution = log_normal
min = 5e8
max = 1e11
mean = 5e8
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 32
max = 1024
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 1
max = 8
scale = auto

[sweep.smerl.num_modes]
distribution = uniform_pow2
min = 2
max = 16 
scale = auto

[sweep.smerl.embed_lr]
distribution = uniform
min = 0.0001
max = 0.1
mean = 0.001
scale = auto

[sweep.env.reward_damage]
distribution = uniform
min = 0.0
max = 0.02
mean = 0.005
scale = auto

[sweep.env.dr]
distribution = uniform
min = 0.0
max = 0.6
mean = 0.3
scale = auto

[sweep.env.reward_melee_damage_inflicted]
distribution = uniform
min = 0.0
max = 0.02
mean = 0.005
scale = auto

[sweep.env.reward_range_damage_inflicted]
distribution = uniform
min = 0.0
max = 0.02
mean = 0.005
scale = auto

[sweep.env.reward_damage_taken]
distribution = uniform
min = -0.02
max = 0.0
mean = -0.005
scale = auto
