[base]
env_name = robocode
checkpoint_interval = 100

[vec]
total_agents = 16384
num_buffers = 4
num_threads = 4
num_policies = 2
hist_policy_hidden_size = 256
hist_policy_num_layers = 6
hist_policy_percent =  0.2

[selfplay]
enabled = 1
max_size = 100
seed = 42
opp_timeout_steps = 10000000
eval_pool_size = 8
eval_games = 0
# 8192 ladder envs x 10 games each. Scripted bots keep their kNN across
# episodes, so one game per env measures only cold bots.
eval_bot_games = 81920
# wave_surfer, hawk_on_fire, raiko, drussgt (BOT_* in bots.h)
eval_bots = 3,4,5,6

# Ladder rungs run without domain randomization or curriculum noise.
# Keys are bare [env] names; the ladder adds the "env." prefix itself.

[bot_eval]
dr = 0
bot_cl_noise = 0
hist_cl_noise = 0

[env]
dr = 0.79440397
num_agents = 2
num_bots = 0
width = 800
height = 600
reward_damage = 0.00266758003
reward_spot = 0
reward_melee_damage_inflicted = 0.00612012995
reward_damage_taken = -0.000659813988
reward_range_damage_inflicted = 0.00412247004
bot_policy = 6
max_ticks = 3000
bot_cl_decay = 0.0126646999
hist_cl_decay = 0
bot_cl_noise = 0
hist_cl_noise = 0

# Historical-env handicap: vs a frozen opponent the learner spawns with energy
# drawn uniformly from this range while the opponent starts at 100. Set both to
# 100 to disable. Only applies where vec.hist_policy_percent puts a frozen
# opponent in the env; pure selfplay and the bot ladder stay symmetric.
hist_energy_min = 25
hist_energy_max = 50

[policy]
hidden_size = 256
num_layers = 6.52669001

[train]
gpus = 1
total_timesteps = 5955252990
learning_rate = 0.00683812005
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.998188972
gae_lambda = 0.930342972
replay_ratio = 0.846162975
clip_coef = 0.249335006
vf_coef = 2.49668002
vf_clip_coef = 0.200000003
max_grad_norm = 1.18215001
ent_coef = 3.53497016e-05
anneal_ent_coef = 0
min_ent_coef_ratio = 0.100000001
momentum = 0.5
minibatch_size = 16384
horizon = 32
vtrace = 0
vtrace_rho_clip = 1
vtrace_c_clip = 1
verb_eps = 0
verb_eps_anneal_start = 0.400000006
verb_eps_anneal_end = 1

[sweep]
gpus = 8

[sweep.train.total_timesteps]
distribution = log_normal
min = 2e8
max = 3e9
mean = 5e8
scale = time

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 32
max = 1024
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 1
max = 8
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 256
max = 16384
scale = auto

[sweep.vec.hist_policy_percent]
distribution = uniform
min = 0.01
max = 1
mean = 0.25
scale = auto

[sweep.selfplay.opp_timeout_steps]
distribution = log_normal
min = 1e7
max = 1e9
mean = 1e8
scale = auto

[sweep.env.dr]
distribution = uniform
min = 0
max = 0.8
mean = 0.3
scale = auto

[sweep.env.reward_melee_damage_inflicted]
distribution = uniform
min = 0
max = 0.02
mean = 0.005
scale = auto

[sweep.env.reward_range_damage_inflicted]
distribution = uniform
min = 0
max = 0.02
mean = 0.005
scale = auto

[sweep.env.reward_damage_taken]
distribution = uniform
min = -0.02
max = 0
mean = -0.005
scale = auto
