[base]
env_name = robocode
checkpoint_interval = 100
[train]
gpus = 8
seed = 42
total_timesteps = 10000000000
learning_rate = 0.015
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.995
gae_lambda = 0.9
replay_ratio = 1
clip_coef = 0.2
vf_coef = 2
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.001
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
beta1 = 0.95
beta2 = 0.999
eps = 1e-12
minibatch_size = 262144
horizon = 256
vtrace_rho_clip = 1
vtrace_c_clip = 1
prio_alpha = 0.8
prio_beta0 = 0.2
global_total_timesteps = 10000000000
local_total_timesteps = 1250000000

[env]
num_agents = 2
num_bots = 0
width = 800
height = 600
reward_damage = 0.00266758
reward_spot = 0
reward_melee_damage_inflicted = 0.00531346
reward_damage_taken = -0.000614805
reward_range_damage_inflicted = 0.0151387
dr = 0.49
arena_dr = 0.2
spawn_dr = 0.3
energy_dr = 0.4
bot_policy = 6
max_ticks = 3000
bot_cl_decay = 0.0244494
bot_cl_noise = 0.970655
hist_cl_noise = 0
hist_cl_decay = 0
mix_enabled = 0
mix_bot_pct = 50
mix_hist_pct = 0
mix_bot_policy_a = 3
mix_bot_policy_b = 6
mix_bot_a_pct = 10

[policy]
hidden_size = 512
num_layers = 3
expansion_factor = 1

[vec]
total_agents = 16384
num_buffers = 4
num_threads = 4
num_frozen_banks = 1
frozen_bank_pct = 0.25
frozen_bank_hidden_size = 512
frozen_bank_num_layers = 3

[selfplay]
enabled = 1
max_size = 100
elo_init = 0
elo_k = 16
seed = 42
snapshot_interval = 20000000
opp_timeout_steps = 10000000
sample = pfsp
pfsp_weighting = linear
pfsp_power = 1
pfsp_epsilon = 0.05
pfsp_explore = 1

[smerl]
enabled = 0
num_modes = 2
bonus_coef = 0
activation_score = 0
gate_enter_epsilon = 0.03
gate_exit_epsilon = 0.06
eval_interval_steps = 200000000
eval_games = 2048
score_ema = 0.8
disc_hidden = 64
disc_lr = 0
embed_lr = 0.01
force_mode = -1

[sweep]
#league = True

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e9
max = 15e9
mean = 5e9
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 8192 
max = 32768 
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 65536 
max = 262144
scale = auto

# Hist pool refresh cadence. Keep well below the old 500M/1B starvation regime
# so the adversary set actually rotates during a trial.
[sweep.selfplay.snapshot_interval]
distribution = log_normal
min = 20e6
max = 200e6
mean = 50e6
scale = auto

[sweep.selfplay.opp_timeout_steps]
distribution = log_normal
min = 20e6
max = 200e6
mean = 50e6
scale = auto

[sweep.env.reward_damage]
distribution = uniform
min = 0.0
max = 0.02
mean = 0.005
scale = auto

[sweep.env.dr]
distribution = uniform
min = 0.0
max = 0.6
mean = 0.3
scale = auto

[sweep.env.arena_dr]
distribution = uniform
min = 0.0
max = 1.0
mean = 0.35
scale = auto

[sweep.env.spawn_dr]
distribution = uniform
min = 0.0
max = 1.0
mean = 0.5
scale = auto

[sweep.env.energy_dr]
distribution = uniform
min = 0.0
max = 1.0
mean = 0.25
scale = auto

[sweep.env.reward_melee_damage_inflicted]
distribution = uniform
min = 0.0
max = 0.02
mean = 0.005
scale = auto

[sweep.env.reward_range_damage_inflicted]
distribution = uniform
min = 0.0
max = 0.02
mean = 0.005
scale = auto

[sweep.env.reward_damage_taken]
distribution = uniform
min = -0.02
max = 0.0
mean = -0.005
scale = auto

[sweep.vec.frozen_bank_pct]
distribution = uniform
min = 0.05
max = 0.5
mean = 0.25
scale = auto
