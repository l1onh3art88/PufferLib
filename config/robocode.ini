[base]
env_name = robocode
checkpoint_interval = 100

[vec]
total_agents = 16384
num_buffers = 4
num_threads = 4
num_policies = 2
hist_policy_hidden_size = 256
hist_policy_num_layers = 8
hist_policy_percent = 0.01

[selfplay]
enabled = 1
max_size = 100
seed = 42
opp_timeout_steps = 21188250
eval_pool_size = 8
eval_games = 0
# 8192 ladder envs x 10 games each. Scripted bots keep their kNN across
# episodes, so one game per env measures only cold bots.
eval_bot_games = 81920
# wave_surfer, hawk_on_fire, raiko, drussgt (BOT_* in bots.h)
eval_bots = 3,4,5,6
seed_pool = 'None'

# Ladder rungs run without domain randomization or curriculum noise.
# Keys are bare [env] names; the ladder adds the "env." prefix itself.

[bot_eval]
dr = 0
bot_cl_noise = 0
hist_cl_noise = 0

[archive_kl]
refs = 'None'
beta_direct = 0
beta_return = 0
ref_smooth = 0.0001
online = 1

[env]
dr = 0.658554196
num_agents = 2
num_bots = 0
width = 800
height = 600
reward_damage = 0.00266758003
reward_spot = 0
reward_melee_damage_inflicted = 0.00323452218
reward_damage_taken = -0.00188630261
reward_range_damage_inflicted = 0.00669276481
bot_policy = 6
max_ticks = 3000
bot_cl_decay = 0.0126646999
hist_cl_decay = 0
bot_cl_noise = 0
hist_cl_noise = 0

[policy]
hidden_size = 256
num_layers = 8

[train]
total_timesteps = 1185939453
learning_rate = 0.00267309463
gamma = 0.999455333
gae_lambda = 0.9180758
replay_ratio = 1.72341347
clip_coef = 0.200000003
vf_coef = 2.34216166
vf_clip_coef = 0.438055426
max_grad_norm = 0.314954937
ent_coef = 9.99999975e-06
momentum = 0.903841376
minibatch_size = 16384
horizon = 64

[sweep]
gpus = 8

[sweep.train.total_timesteps]
distribution = log_normal
min = 2e8
max = 3e9
mean = 5e8
scale = time

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 32
max = 1024
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 1
max = 8
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 256
max = 16384
scale = auto

[sweep.vec.hist_policy_percent]
distribution = uniform
min = 0.01
max = 1
mean = 0.25
scale = auto

[sweep.selfplay.opp_timeout_steps]
distribution = log_normal
min = 1e7
max = 1e9
mean = 1e8
scale = auto

[sweep.env.dr]
distribution = uniform
min = 0
max = 0.8
mean = 0.3
scale = auto

[sweep.env.reward_melee_damage_inflicted]
distribution = uniform
min = 0
max = 0.02
mean = 0.005
scale = auto

[sweep.env.reward_range_damage_inflicted]
distribution = uniform
min = 0
max = 0.02
mean = 0.005
scale = auto

[sweep.env.reward_damage_taken]
distribution = uniform
min = -0.02
max = 0
mean = -0.005
scale = auto
