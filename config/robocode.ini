[base]
env_name = robocode
checkpoint_interval = 100

[vec]
total_agents = 16384
num_buffers = 4
num_threads = 4
num_frozen_banks = 0
frozen_bank_pct = 0
frozen_bank_hidden_size = 512
frozen_bank_num_layers = 4

[selfplay]
enabled = 0
max_size = 100
elo_init = 0
elo_k = 16
seed = 42
snapshot_interval = 200000000
opp_timeout_steps = 100000000
pfsp_power = 1
pfsp_epsilon = 0.05
pfsp_explore = 1

[smerl]
enabled = 0
num_modes = 2
bonus_coef = 0
activation_score = 0
gate_enter_epsilon = 0.03
gate_exit_epsilon = 0.06
eval_interval_steps = 200000000
eval_games = 2048
score_ema = 0.8
disc_hidden = 64
disc_lr = 0
embed_lr = 0.01
force_mode = -1

[env]
num_agents = 1
num_bots = 1
width = 800
height = 600
reward_damage = 0.00266758
reward_spot = 0
reward_melee_damage_inflicted = 0.00531346
reward_damage_taken = -0.000614805
reward_range_damage_inflicted = 0.0151387
dr = 0.339738
bot_policy = 6
max_ticks = 3000
bot_cl_decay = 0.0244494
bot_cl_noise = 0.970655
#bot_cl_noise = 0.0
# Opponent mix (option 2): heterogeneous envs in one vec.
# mix_enabled=0 → pure kwargs layout (num_agents/num_bots/bot_policy).
# mix_enabled=1 → env index hash into BOT / HIST / SP buckets:
#   mix_bot_pct  % of envs → agent vs scripted bot (1 agent + 1 bot)
#   mix_hist_pct % of envs → agent vs frozen historical (needs selfplay.on)
#   remainder      → live selfplay (2 agents, tag=0)
# Among bot envs: mix_bot_a_pct% use mix_bot_policy_a, rest policy_b.
mix_enabled = 1
mix_bot_pct = 50
mix_hist_pct = 0
mix_bot_policy_a = 3
mix_bot_policy_b = 6
mix_bot_a_pct = 10
[policy]
expansion_factor = 1
hidden_size = 512
num_layers = 4.35402

[train]
gpus = 1
seed = 42
total_timesteps = 1426060058
anneal_lr = 1
min_lr_ratio = 0
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
learning_rate = 0.00239282
ent_coef = 6.05618e-05
gamma = 0.999872
gae_lambda = 0.987328
vtrace_rho_clip = 1.5165
vtrace_c_clip = 1.17857
clip_coef = 0.280609
vf_clip_coef = 1.08415
vf_coef = 2.39818
max_grad_norm = 1.05681
beta1 = 0.970699
beta2 = 0.923412
eps = 7.92106e-09
prio_alpha = 0.946603
prio_beta0 = 0.966695
horizon = 256
replay_ratio = 0.25
minibatch_size = 8192


[sweep]
league = True

[sweep.train.total_timesteps]
distribution = log_normal
min = 5e8
max = 1e11
mean = 5e8
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 32
max = 1024
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 1
max = 8
scale = auto

[sweep.smerl.num_modes]
distribution = uniform_pow2
min = 2
max = 16 
scale = auto

[sweep.smerl.embed_lr]
distribution = uniform
min = 0.0001
max = 0.1
mean = 0.001
scale = auto

[sweep.env.reward_damage]
distribution = uniform
min = 0.0
max = 0.02
mean = 0.005
scale = auto

[sweep.env.dr]
distribution = uniform
min = 0.0
max = 0.6
mean = 0.3
scale = auto

[sweep.env.reward_melee_damage_inflicted]
distribution = uniform
min = 0.0
max = 0.02
mean = 0.005
scale = auto

[sweep.env.reward_range_damage_inflicted]
distribution = uniform
min = 0.0
max = 0.02
mean = 0.005
scale = auto

[sweep.env.reward_damage_taken]
distribution = uniform
min = -0.02
max = 0.0
mean = -0.005
scale = auto
