[base]
package = ocean
env_name = puffer_tradesim
policy_name = Policy
rnn_name = Recurrent
[vec]
num_envs = 2

[env]
num_envs = 2048
data_path = resources/tradesim/data.bin
reward_pnl_scale = 100.0
reward_illegal_move = -0.01
[policy]
hidden_size = 128

[rnn]
input_size = 128
hidden_size = 128

[train]
total_timesteps = 50_000_000 
batch_size = 524288
minibatch_size = 32768

[sweep.train.total_timesteps]
distribution = log_normal
min = 2e7
max = 2e8
mean = 8e7
scale = auto

[sweep.env.reward_pnl_scale]
distribution = uniform
min = 0.0
max = 1000.0
scale = auto

[sweep.env.reward_illegal_move]
distribution = uniform
min = -1.0
max = 0
scale = auto
