[base]
package = ocean
env_name = puffer_tradesim
policy_name = Policy
rnn_name = Recurrent

[vec]
num_envs = 2
backend = Serial

[env]
num_envs = 2048
data_path = resources/tradesim/data.bin

[policy]
hidden_size = 128

[rnn]
input_size = 128
hidden_size = 128

[train]
total_timesteps = 100_000_000 
batch_size = 524288
minibatch_size = 32768
[sweep.train.total_timesteps]
distribution = log_normal
min = 2e7
max = 5e8
mean = 8e7
scale = auto
