[base]
package = ocean
env_name = puffer_tradesim
policy_name = Policy
rnn_name = Recurrent
[vec]
num_envs = 2
#backend = Serial
[env]
num_envs = 2048
data_path = resources/tradesim/data.bin
reward_pnl_scale = 672.3515753454295
reward_illegal_move = 0
[policy]
hidden_size = 128

[rnn]
input_size = 128
hidden_size = 128

[train]
total_timesteps = 500_000_000 
batch_size = 524288
minibatch_size = 32768
adam_beta1 = 0.6446800388775205
adam_beta2 = 0.9994956392372563
adam_eps = 1.8658264299058805e-10
bptt_horizon = 64
clip_coef = 0.2609008268835915
ent_coef = 0.0306012250953303
gae_lambda = 0.8774799724708484
gamma = 0.9452170856560004
learning_rate = 0.01025275399898769
max_grad_norm = 0.2473872243203168
prio_alpha = 0.6365294020404544
prio_beta0 = 0.6493783331944499
vf_coef = 1.8144487575107202
vtrace_c_clip = 1.1474512777088925
vtrace_rho_clip = 0.5586626590363103

[sweep.train.total_timesteps]
distribution = log_normal
min = 2e8
mean = 3e8
max = 4e8
scale = auto

[sweep.env.reward_pnl_scale]
distribution = uniform
min = 1.0
mean = 500.0
max = 1000.0
scale = auto

[sweep.env.reward_illegal_move]
distribution = uniform
min = -1.0
mean = -0.25
max = 0
scale = auto
