[base]
package = ocean
env_name = puffer_chess
policy_name = ChessCNN
rnn_name = Recurrent

[vec]
backend = Multiprocessing
num_envs = 8
num_workers = auto
batch_size = auto

[env]
num_envs = 1024
max_moves = 50000
reward_draw = 0.0
reward_invalid_piece = 0.0
reward_invalid_move = 0
reward_valid_piece = 0.0
reward_valid_move = 0.0
reward_material = 0.0
reward_castling = 0.004197111390531063
reward_repetition = -0.015156011078506707
multi_fen = false
enable_50_move_rule = 1
enable_threefold_repetition = 1

[policy]
cnn_channels = 64
hidden_size = 512
use_action_masking = 1

[rnn]
input_size = 512
hidden_size = 512

[train]
seed = 42
torch_deterministic = True
device = cuda
optimizer = muon
anneal_lr = True
total_timesteps = 10_000_000_000
learning_rate = 0.0013536513454945227
gamma = 0.9775709800934419
gae_lambda = 0.9737923617661
update_epochs = 1
clip_coef = 0.2537779247388243
vf_coef = 0.37113670725375414
vf_clip_coef = 2.3882273548282686
max_grad_norm = 1.6910124942660332
ent_coef = 0.04038749237795497
minibatch_size = 32768
bptt_horizon = 32
adam_beta1 = 0.9952903563235829
adam_beta2 = 0.9999460413095517
adam_eps = 6.302488531664584e-07
prio_alpha = 0.7920141499406875
prio_beta0 = 0.9742730304878308
vtrace_c_clip = 1.8192733591422439
vtrace_rho_clip = 3.2407576125115156

[sweep]
method = Protein
metric = elo
goal = maximize
downsample = 5
use_gpu = True
prune_pareto = True

[sweep.train.total_timesteps]
distribution = log_normal
min = 500e6
max = 2e9
mean = 1e9
scale = time

[sweep.train.ent_coef]
distribution = log_normal
min = 0.03
max = 0.25
mean = 0.18
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 1e-4
max = 1e-2
mean = 3e-3
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.1
max = 0.3
mean = 0.2
scale = auto

[sweep.train.gamma]
distribution = uniform
min = 0.97
max = 0.995
mean = 0.99
scale = auto

[sweep.train.gae_lambda]
distribution = uniform
min = 0.90
max = 0.98
mean = 0.95
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.5
max = 2.0
mean = 1.5
scale = auto



[sweep.env.reward_repetition]
distribution = uniform
min = -0.03
max = 0.0
mean = -0.02
scale = auto

[sweep.env.reward_castling]
distribution = uniform
min = 0.0
max = 0.02
mean = 0.01
scale = auto
